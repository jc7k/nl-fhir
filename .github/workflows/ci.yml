name: CI Pipeline - NL-FHIR Production Readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Auto-cancel outdated runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

# Every step below is blocking: no continue-on-error, no `|| true`.
# Integration tests (tests/epic/, tests/integration/) need a live HAPI FHIR
# server and run locally only - see docs/testing/LOCAL_INTEGRATION_TESTS.md (#44).
jobs:
  test:
    name: "Tests, Lint & Security"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to diff against the PR base for lint

      - name: Setup Python environment (with caching)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run tests
        run: |
          uv run pytest \
            tests/test_review_safety_regressions.py \
            tests/services/fhir/factories/ \
            tests/nlp/ \
            tests/security/ \
            tests/api/ \
            tests/load/ \
            --tb=short
        timeout-minutes: 15

      - name: Run Bandit security linter (medium+ severity)
        run: uv run bandit -r src/nl_fhir/ -ll

      # Most existing files carry lint debt, so only files added by the PR are checked.
      - name: Lint files added in this PR
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ -z "$files" ]; then
            echo "No new Python files to lint"
            exit 0
          fi
          echo "$files"
          uv run ruff check $files
          uv run ruff format --check $files

  docker:
    name: "Docker Build & Boot"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python environment (with caching)
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install docker-compose (symlink to docker compose plugin)
        run: |
          mkdir -p /home/runner/.docker/cli-plugins
          sudo ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
          docker-compose version

      - name: Run Docker configuration tests
        run: |
          uv run pytest tests/deployment/ -v --tb=short -k "not slow and not integration" --no-cov
        timeout-minutes: 3

      - name: Build Docker image (with layer caching)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nl-fhir:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
        timeout-minutes: 10

      - name: Test Docker image starts
        run: |
          # Container listens on 8000 (Dockerfile CMD); map it to host 8001
          docker run -d --name nl-fhir-test -p 8001:8000 nl-fhir:ci
          # Startup runs model warmup in each worker; poll instead of a fixed sleep
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null; then
              echo "Healthy after ~$((i * 3))s"
              docker stop nl-fhir-test
              exit 0
            fi
            sleep 3
          done
          echo "Container did not become healthy; logs:"
          docker logs nl-fhir-test
          exit 1
        timeout-minutes: 3
